/**:
  ros__parameters:
    # PointCloud2 topic from the simulation / rosbag / synthetic source
    pointcloud_topic: "/sim_points"

    # VSSP TCP port (real sensor: 10940)
    tcp_port: 10940

    # Frames per second (datasheet: 20 Hz)
    scan_rate_hz: 20.0

    # Scan geometry (datasheet): horizontal +-105 deg, vertical -5..+35
    # deg. The mirror oscillates at 1200 Hz while the rangefinder
    # samples at 88800 points/s, so one line is one oscillation of 74
    # spots and 35 measured lines make the quoted 2590 points per frame.
    horizontal_fov_deg: 210.0
    vertical_fov_min_deg: -5.0
    vertical_fov_max_deg: 35.0
    measured_lines: 35

    # Sensor noise, applied to the range value along the beam.
    # Off by default: the simulation feeding the emulator usually models
    # sensor noise already, and adding it on both sides would
    # misrepresent what the driver really sees. Enable it only when the
    # point source is noise-free (a synthetic scene, a clean rosbag).
    range_noise_sigma_m: 0.0     # e.g. 0.02 = 20 mm std-dev
    dropout_probability: 0.0     # e.g. 0.01 = 1 % of spots report no echo
    noise_seed: 0                # same seed + same input = same output

    # Identification reported by the VER command
    serial_number: "H0000001"
    firmware_version: "1.2.0-hils"

    # Network config
    # device_ip: IP assigned to the interface acting as the emulated YVT-35LX
    #            (loopback E2E: 127.0.0.1)
    # host_ip: Robot PC IP where urg3d_node2 runs
    # network_interface: interface to bind (e.g. "eth1"). Empty = auto.
    device_ip: "192.168.0.10"
    host_ip: "192.168.0.15"
    network_interface: ""
